<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noapte buna Ina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a0b2e 0%, #2e1046 50%, #4c1d95 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .romantic-font {
            font-family: 'Dancing Script', cursive;
        }

        /* Heart particle styling */
        .heart-particle {
            position: absolute;
            width: 16px;
            height: 16px;
            background-color: #ec4899;
            transform: rotate(-45deg);
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.6);
        }

        .heart-particle::before,
        .heart-particle::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background-color: #ec4899;
            border-radius: 50%;
        }

        .heart-particle::before {
            top: -8px;
            left: 0;
        }

        .heart-particle::after {
            top: 0;
            left: 8px;
        }

        /* Glow effect for the final message */
        .glow-message {
            opacity: 0;
            transform: scale(0.8);
            transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 0 20px rgba(244, 114, 182, 0.8), 0 0 40px rgba(236, 72, 153, 0.6), 0 0 60px rgba(219, 39, 119, 0.4);
        }

        .glow-message.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* Floating background stars/dust */
        @keyframes floatDust {
            0% { transform: translateY(0) translateX(0); opacity: 0.2; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100vh) translateX(20px); opacity: 0.2; }
        }

        .dust {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            animation: floatDust linear infinite;
        }

        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(236, 72, 153, 0.5)); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 25px rgba(244, 114, 182, 0.8)); }
        }

        .heart-pulsing {
            animation: gentlePulse 4s ease-in-out infinite;
        }

        @keyframes textGlow {
            0%, 100% { text-shadow: 0 0 20px rgba(244, 114, 182, 0.8), 0 0 40px rgba(236, 72, 153, 0.6); }
            50% { text-shadow: 0 0 30px rgba(244, 114, 182, 1), 0 0 60px rgba(236, 72, 153, 0.8), 0 0 80px rgba(219, 39, 119, 0.6); }
        }

        .glow-message.visible {
            opacity: 1;
            transform: scale(1);
            animation: textGlow 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="relative">

    <div id="dust-container" class="absolute inset-0 overflow-hidden pointer-events-none"></div>

    <div class="relative w-full h-full flex items-center justify-center">
        <!-- Container where hearts will animate -->
        <div id="heart-container" class="absolute w-[300px] h-[300px] sm:w-[400px] sm:h-[400px] flex items-center justify-center"></div>

        <!-- Central Message -->
        <div id="message-box" class="absolute text-center z-20 px-4">
            <h1 class="glow-message romantic-font text-5xl sm:text-7xl md:text-8xl text-pink-200 font-bold tracking-wide">
                Noapte bună, Ina
            </h1>
            <p class="glow-message romantic-font text-2xl sm:text-3xl text-pink-300 mt-2 font-light opacity-90 delay-300">
                Visuri frumoase... ✨
            </p>
        </div>
    </div>

    <script>
        const dustContainer = document.getElementById('dust-container');
        for (let i = 0; i < 50; i++) {
            const dust = document.createElement('div');
            dust.classList.add('dust');
            const size = Math.random() * 3 + 1;
            dust.style.width = `${size}px`;
            dust.style.height = `${size}px`;
            dust.style.left = `${Math.random() * 100}vw`;
            dust.style.top = `${Math.random() * 100}vh`;
            dust.style.animationDuration = `${Math.random() * 6 + 4}s`;
            dust.style.animationDelay = `${Math.random() * 5}s`;
            dustContainer.appendChild(dust);
        }

        // Mathematical heart shape generator function (parametric equation)
        function getHeartCoordinates(t, scale = 15) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return {
                x: x * scale,
                y: y * scale
            };
        }

        const heartContainer = document.getElementById('heart-container');
        const totalHearts = 90; // Increased particle count for a denser, smoother shape
        const hearts = [];

        // Generate heart particle elements with slight variations for organic feel
        for (let i = 0; i < totalHearts; i++) {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            
            const t = (i / totalHearts) * 2 * Math.PI;
            const scaleFactor = window.innerWidth < 640 ? 11 : 14;
            const targetPos = getHeartCoordinates(t, scaleFactor);
            
            heartContainer.appendChild(heart);
            hearts.push({
                element: heart,
                targetX: targetPos.x,
                targetY: targetPos.y
            });
        }

        // Trigger longer, smoother animation after initial load
        window.addEventListener('load', () => {
            setTimeout(() => {
                hearts.forEach((item, index) => {
                    // Slower staggered timing for a graceful, flowing outward movement
                    setTimeout(() => {
                        const el = item.element;
                        // Start small and at the center
                        el.style.transform = `translate(0px, 0px) scale(0.1) rotate(-45deg)`;
                        el.style.opacity = '0';

                        // Much slower, graceful cubic-bezier transition (3.5 seconds per particle path)
                        el.style.transition = 'all 3.5s cubic-bezier(0.16, 1, 0.3, 1)';
                        el.style.transform = `translate(${item.targetX}px, ${item.targetY}px) scale(1) rotate(-45deg)`;
                        el.style.opacity = '1';
                    }, index * 35); // Stagger interval lengthened for a slow, poetic unfurling
                });

                // Once the heart fully forms, apply the pulsing animation wrapper and reveal the glowing message
                setTimeout(() => {
                    heartContainer.classList.add('heart-pulsing');
                    const messages = document.querySelectorAll('.glow-message');
                    messages.forEach(msg => msg.classList.add('visible'));
                }, totalHearts * 35 + 2500);

            }, 800);
        });
    </script>
</body>
</html>
