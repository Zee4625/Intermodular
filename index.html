<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mașina și Scrisoarea Drăguță</title>
    <!-- Tailwind CSS pentru un design rapid și curat -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animație pentru mașină: Pornește din afara ecranului în dreapta și iese în stânga */
        @keyframes driveCar {
            0% {
                transform: translateX(110vw);
            }
            100% {
                transform: translateX(-150vw);
            }
        }

        /* Animație pentru apariția și căderea plicului */
        @keyframes dropEnvelope {
            0% {
                transform: translate(0, -50px) scale(0);
                opacity: 0;
            }
            40% {
                transform: translate(0, 0) scale(1.1);
                opacity: 1;
            }
            50% {
                transform: translate(0, -10px) scale(1);
            }
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
        }

        .animate-car {
            animation: driveCar 5s linear forwards;
            animation-play-state: paused; /* Oprit până la apăsarea butonului */
        }

        .animate-envelope {
            animation: dropEnvelope 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            display: none;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-100 to-indigo-200 h-screen overflow-hidden flex flex-col justify-between select-none">

    <!-- Partea de Sus / Titlu -->
    <div class="text-center pt-10">
        <h1 class="text-3xl font-bold text-pink-600 drop-shadow">O călătorie magică... 💌</h1>
        <p class="text-gray-600 mt-2">Apasă butonul de mai jos pentru a porni mașina!</p>
        <button id="startBtn" class="mt-4 bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition active:scale-95 cursor-pointer">
            Pornește Mașina 🚗
        </button>
    </div>

    <!-- Zona de Joc / Ecranul de animație -->
    <div class="relative w-full h-64 overflow-hidden my-auto border-y-4 border-dashed border-pink-300 bg-white/40 backdrop-blur-sm flex items-center">
        
        <!-- Șoseaua / Linia de fundal -->
        <div class="absolute w-full h-2 bg-gray-400 top-1/2 -translate-y-1/2 z-0"></div>

        <!-- MAȘINA (GIF) -->
        <div id="carContainer" class="absolute z-20 animate-car top-1/2 -translate-y-1/2 right-0">
            <!-- Asigură-te că imaginea car.gif este în același folder -->
            <img id="carImage" src="car.gif" alt="Mașină" class="w-36 md:w-48 object-contain transform scale-x-[-1]">
        </div>

        <!-- SCRISOAREA / PLICUL (CUTE) -->
        <div id="envelope" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-30 animate-envelope cursor-pointer">
            <div class="bg-pink-200 border-2 border-pink-400 w-28 h-20 rounded-lg shadow-xl flex items-center justify-center relative transform hover:scale-110 transition duration-300">
                <!-- Partea de sus a plicului (triunghiul) -->
                <div class="absolute top-0 w-0 h-0 border-l-[56px] border-l-transparent border-r-[56px] border-r-transparent border-t-[40px] border-t-pink-300"></div>
                <!-- O inimioară mică și drăguță pe plic -->
                <span class="text-2xl z-10 animate-bounce">💖</span>
            </div>
        </div>

    </div>

    <!-- Partea de Jos / Footer -->
    <div class="text-center pb-8 text-gray-500 text-sm">
        Creat cu drag pentru tine ✨
    </div>

    <!-- Scriptul JavaScript mutat la final pentru a asigura încărcarea corectă a elementelor -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const startBtn = document.getElementById('startBtn');
            const carContainer = document.getElementById('carContainer');
            const envelope = document.getElementById('envelope');

            startBtn.addEventListener('click', () => {
                // Ascundem butonul în timpul animației
                startBtn.classList.add('opacity-50', 'pointer-events-none');
                
                // Resetăm stările în caz că se apasă de mai multe ori
                carContainer.style.animationPlayState = 'paused';
                carContainer.style.animation = 'none';
                envelope.style.display = 'none';
                void carContainer.offsetWidth; // Trigger reflow

                // Pornim animația mașinii
                carContainer.style.animation = 'driveCar 4s linear forwards';
                carContainer.style.animationPlayState = 'running';

                // Când mașina ajunge la mijloc (la 2 secunde), apare plicul
                setTimeout(() => {
                    envelope.style.display = 'block';
                }, 2000);

                // După ce se termină animația, reactivăm butonul
                setTimeout(() => {
                    startBtn.classList.remove('opacity-50', 'pointer-events-none');
                }, 4000);
            });

            // Evenimentul de click pe plic
            envelope.addEventListener('click', () => {
                alert('Aici va fi scrisoarea ta drăguță! 💌✨');
            });
        });
    </script>
</body>
</html>
