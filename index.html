<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🩷 Ina - Mesaj Special 🩷</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #0f0a15;
            color: #fce7f3;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .code-font {
            font-family: 'Fira Code', monospace;
        }
        .pink-glow {
            box-shadow: 0 0 35px rgba(244, 114, 182, 0.45);
        }
        .pink-glow-lg {
            box-shadow: 0 0 70px rgba(236, 72, 153, 0.65);
        }
        @keyframes letterPop {
            0% { transform: scale(0.4) rotate(-8deg); opacity: 0; }
            70% { transform: scale(1.05) rotate(2deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-letter {
            animation: letterPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
        }
        .floating-heart {
            position: absolute;
            animation: floatUp 6s infinite ease-in-out;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between items-center relative select-none">

    <div id="hearts-container" class="absolute inset-0 pointer-events-none overflow-hidden z-0"></div>

    <header class="w-full max-w-4xl mt-3 mx-4 z-20 flex justify-center">
        <section class="window w-full bg-[#1b1226]/95 border border-pink-500/40 rounded-2xl shadow-2xl backdrop-blur-md overflow-hidden">
            <header class="titlebar bg-[#261836] px-4 py-2.5 border-b border-pink-500/30 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span>
                    <span class="w-3 h-3 rounded-full bg-amber-400 inline-block"></span>
                    <span class="w-3 h-3 rounded-full bg-emerald-400 inline-block"></span>
                </div>
                <span class="code-font text-pink-300 text-xs md:text-sm font-semibold tracking-wider">♥ romantic_archery_ina.html ♥</span>
                <span id="score-display" class="code-font text-xs text-pink-400/80 bg-pink-950/50 px-2 py-0.5 rounded-md">Încercări: 0</span>
            </header>
        </section>
    </header>

    <main class="w-full flex-1 relative flex items-center justify-center z-10 overflow-hidden max-w-5xl">
        <canvas id="gameCanvas" class="w-full h-full cursor-crosshair touch-none"></canvas>

        <div id="instruction-overlay" class="absolute top-4 left-1/2 -translate-x-1/2 bg-[#1b1226]/90 border border-pink-500/30 backdrop-blur-md px-5 py-2.5 rounded-full text-center shadow-lg transition-opacity duration-500 pointer-events-none">
            <p class="text-pink-200 text-xs md:text-sm font-semibold tracking-wide flex items-center gap-2">
                <span>🏹</span> Trage cu arcul în plic! (Atinge și trage înapoi)
            </p>
        </div>
    </main>

    <div id="letter-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-gradient-to-b from-[#fff1f2] to-[#ffe4e6] text-slate-800 rounded-3xl p-6 md:p-8 max-w-lg w-full shadow-2xl pink-glow-lg animate-letter relative border-4 border-pink-300">
            
            <div class="absolute -top-7 left-1/2 -translate-x-1/2 bg-rose-500 text-white w-14 h-14 rounded-full flex items-center justify-center text-3xl shadow-lg border-2 border-white animate-bounce">
                💌
            </div>

            <div class="mt-4 text-center">
                <h2 class="text-2xl md:text-3xl font-bold text-rose-600 mb-2 font-['Quicksand'] drop-shadow-sm">
                    🩷🩷 Ina 🩷🩷
                </h2>
                <div class="w-20 h-1 bg-rose-300 mx-auto rounded-full mb-6"></div>
            </div>

            <div class="flex flex-col md:flex-row items-center md:items-start gap-6 mb-6">
                <!-- Left side: Corrected grammar text -->
                <div class="flex-1 text-left">
                    <p class="text-slate-700 text-sm md:text-base font-medium leading-relaxed italic">
                        "Heyyy, am vrut să îți spun că ești foarte drăguță și simpatică 🩷 și sper ca această scrisoare să te facă să zâmbești așa cum tu mă faci pe mine să zâmbesc mereu"
                    </p>
                </div>

                <!-- Right side: cat-smile.gif photo with nothing written underneath -->
                <div class="flex flex-col items-center justify-center shrink-0">
                    <div class="w-28 h-32 md:w-32 md:h-36 bg-white p-2 rounded-xl shadow-md border-2 border-pink-200 rotate-2 hover:rotate-0 transition-transform duration-300 flex items-center justify-center overflow-hidden">
                        <img src="cat-smile.gif" alt="Cat Smile" class="w-full h-full object-cover rounded-lg" onerror="this.src='https://placehold.co/120x140/fbcfe8/f43f5e?text=🐱';">
                    </div>
                </div>
            </div>

            <div class="text-center border-t border-pink-200/60 pt-4">
                <p class="text-rose-500 font-bold text-sm tracking-wider uppercase">
                    Semnat: Gheorghe
                </p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const letterModal = document.getElementById('letter-modal');
        const scoreDisplay = document.getElementById('score-display');
        const instructionOverlay = document.getElementById('instruction-overlay');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let attempts = 0;
        let isAiming = false;
        let bowPosition = { x: 120, y: canvas.height / 2 };
        let pullPoint = { x: 120, y: canvas.height / 2 };
        let arrowInFlight = null;
        let letterOpened = false;
        let particles = [];

        const letterTarget = {
            x: canvas.width - 150,
            y: canvas.height / 2,
            width: 110,
            height: 80,
            pulseTimer: 0
        };

        const catStampImg = new Image();
        catStampImg.src = 'cat-smile.gif';
        let stampLoaded = false;
        catStampImg.onload = () => { stampLoaded = true; };
        catStampImg.onerror = () => { stampLoaded = false; };

        function updatePositions() {
            letterTarget.x = Math.max(160, canvas.width * 0.75);
            bowPosition.x = Math.min(110, canvas.width * 0.12);
            if (!arrowInFlight && !isAiming) {
                bowPosition.y = canvas.height / 2;
                pullPoint = { ...bowPosition };
            }
        }
        window.addEventListener('resize', updatePositions);
        updatePositions();

        const heartsContainer = document.getElementById('hearts-container');
        function createBackgroundHearts() {
            for (let i = 0; i < 14; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart text-pink-500/20 text-lg md:text-2xl';
                heart.innerHTML = ['🩷', '💖', '✨', '💘'][Math.floor(Math.random() * 4)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (5 + Math.random() * 5) + 's';
                heart.style.animationDelay = (Math.random() * 5) + 's';
                heartsContainer.appendChild(heart);
            }
        }
        createBackgroundHearts();

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        canvas.addEventListener('pointerdown', startAim);
        canvas.addEventListener('pointermove', dragBow);
        window.addEventListener('pointerup', releaseBow);
        window.addEventListener('pointercancel', releaseBow);

        function startAim(e) {
            if (letterOpened || arrowInFlight) return;
            const pos = getPos(e);
            const dist = Math.hypot(pos.x - bowPosition.x, pos.y - bowPosition.y);
            if (dist < 140 || pos.x < canvas.width * 0.45) {
                isAiming = true;
                pullPoint = pos;
                instructionOverlay.style.opacity = '0';
            }
        }

        function dragBow(e) {
            if (!isAiming || letterOpened || arrowInFlight) return;
            const pos = getPos(e);
            const maxPull = 150;
            const dx = pos.x - bowPosition.x;
            const dy = pos.y - bowPosition.y;
            const dist = Math.hypot(dx, dy);

            if (dist > maxPull) {
                pullPoint.x = bowPosition.x + (dx / dist) * maxPull;
                pullPoint.y = bowPosition.y + (dy / dist) * maxPull;
            } else {
                pullPoint = pos;
            }
        }

        function releaseBow() {
            if (!isAiming || letterOpened || arrowInFlight) return;
            isAiming = false;

            const dx = bowPosition.x - pullPoint.x;
            const dy = bowPosition.y - pullPoint.y;
            const pullDist = Math.hypot(dx, dy);

            if (pullDist > 20) {
                attempts++;
                scoreDisplay.textContent = `Încercări: ${attempts}`;
                
                const speed = pullDist * 0.18;
                const angle = Math.atan2(dy, dx);

                arrowInFlight = {
                    x: bowPosition.x,
                    y: bowPosition.y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    angle: angle
                };
            } else {
                pullPoint = { ...bowPosition };
                instructionOverlay.style.opacity = '1';
            }
        }

        function triggerHitParticles(x, y) {
            for (let i = 0; i < 25; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 6;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    color: Math.random() > 0.5 ? '#f472b6' : '#fb7185',
                    size: 8 + Math.random() * 10
                });
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Render particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.02;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.font = `${p.size}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('💖', p.x, p.y);
                    ctx.restore();
                }
            }

            // Render floating envelope target
            letterTarget.pulseTimer += 0.04;
            const floatOffset = Math.sin(letterTarget.pulseTimer) * 7;
            const targetX = letterTarget.x;
            const targetY = letterTarget.y + floatOffset;

            ctx.save();
            ctx.translate(targetX, targetY);

            ctx.shadowColor = '#ec4899';
            ctx.shadowBlur = 30;

            ctx.fillStyle = '#fff1f2';
            ctx.strokeStyle = '#db2777';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(-55, -42, 110, 84, 12);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-55, -42);
            ctx.lineTo(0, 8);
            ctx.lineTo(55, -42);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-55, 42);
            ctx.lineTo(-18, 0);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(55, 42);
            ctx.lineTo(18, 0);
            ctx.stroke();

            // Stamp stamp
            ctx.save();
            ctx.translate(30, -22);
            ctx.fillStyle = '#fbcfe8';
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 1.5;
            ctx.fillRect(0, 0, 22, 26);
            ctx.strokeRect(0, 0, 22, 26);

            if (stampLoaded) {
                ctx.drawImage(catStampImg, 2, 2, 18, 22);
            } else {
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🐱', 11, 13);
            }
            ctx.restore();

            ctx.font = '28px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('💗', 0, 6);

            ctx.restore();

            // Update flying arrow
            if (arrowInFlight) {
                arrowInFlight.x += arrowInFlight.vx;
                arrowInFlight.y += arrowInFlight.vy;
                arrowInFlight.vy += 0.035;
                arrowInFlight.angle = Math.atan2(arrowInFlight.vy, arrowInFlight.vx);

                ctx.save();
                ctx.translate(arrowInFlight.x, arrowInFlight.y);
                ctx.rotate(arrowInFlight.angle);

                ctx.strokeStyle = '#f472b6';
                ctx.lineWidth = 4.5;
                ctx.beginPath();
                ctx.moveTo(-45, 0);
                ctx.lineTo(20, 0);
                ctx.stroke();

                ctx.fillStyle = '#fb7185';
                ctx.beginPath();
                ctx.moveTo(25, 0);
                ctx.lineTo(10, -8);
                ctx.lineTo(10, 8);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#ec4899';
                ctx.beginPath();
                ctx.moveTo(-45, 0);
                ctx.lineTo(-54, -8);
                ctx.lineTo(-50, 0);
                ctx.lineTo(-54, 8);
                ctx.closePath();
                ctx.fill();

                ctx.restore();

                const hitBoxLeft = targetX - letterTarget.width / 2;
                const hitBoxRight = targetX + letterTarget.width / 2;
                const hitBoxTop = targetY - letterTarget.height / 2;
                const hitBoxBottom = targetY + letterTarget.height / 2;

                if (arrowInFlight.x >= hitBoxLeft && arrowInFlight.x <= hitBoxRight &&
                    arrowInFlight.y >= hitBoxTop && arrowInFlight.y <= hitBoxBottom) {
                    triggerHitParticles(targetX, targetY);
                    arrowInFlight = null;
                    letterOpened = true;
                    setTimeout(() => {
                        letterModal.classList.remove('hidden');
                    }, 400);
                }

                if (arrowInFlight && (arrowInFlight.x > canvas.width + 60 || arrowInFlight.y > canvas.height + 60 || arrowInFlight.y < -60)) {
                    arrowInFlight = null;
                    pullPoint = { ...bowPosition };
                    instructionOverlay.style.opacity = '1';
                }
            }

            // Render bow and arrow
            ctx.save();
            const bowX = bowPosition.x;
            const bowY = bowPosition.y;

            if (isAiming) {
                ctx.strokeStyle = '#f472b6';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(bowX - 8, bowY - 85);
                ctx.lineTo(pullPoint.x, pullPoint.y);
                ctx.lineTo(bowX - 8, bowY + 85);
                ctx.stroke();

                const aimAngle = Math.atan2(bowY - pullPoint.y, bowX - pullPoint.x);
                ctx.save();
                ctx.translate(pullPoint.x, pullPoint.y);
                ctx.rotate(aimAngle + Math.PI);

                ctx.strokeStyle = '#f472b6';
                ctx.lineWidth = 4.5;
                ctx.beginPath();
                ctx.moveTo(-45, 0);
                ctx.lineTo(20, 0);
                ctx.stroke();

                ctx.fillStyle = '#fb7185';
                ctx.beginPath();
                ctx.moveTo(25, 0);
                ctx.lineTo(10, -8);
                ctx.lineTo(10, 8);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            } else {
                ctx.strokeStyle = '#db2777';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(bowX - 8, bowY - 85);
                ctx.quadraticCurveTo(bowX - 30, bowY, bowX - 8, bowY + 85);
                ctx.stroke();
            }

            ctx.strokeStyle = '#db2777';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(bowX - 14, bowY - 85);
            ctx.quadraticCurveTo(bowX - 25, bowY - 40, bowX - 16, bowY);
            ctx.quadraticCurveTo(bowX - 25, bowY + 40, bowX - 14, bowY + 85);
            ctx.stroke();

            ctx.fillStyle = '#f472b6';
            ctx.beginPath();
            ctx.roundRect(bowX - 20, bowY - 16, 12, 32, 6);
            ctx.fill();

            ctx.restore();

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
