<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesaj Special din Mers</title>
    <!-- Tailwind CSS for modern utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        .font-serif-custom {
            font-family: 'Playfair Display', serif;
        }

        /* Keyframes for car moving from right to left */
        @keyframes driveRightToLeft {
            0% {
                transform: translateX(120vw);
            }
            45% {
                transform: translateX(0vw); /* Stops or slows near center */
            }
            55% {
                transform: translateX(0vw); /* Pause for envelope drop */
            }
            100% {
                transform: translateX(-130vw); /* Exits left */
            }
        }

        /* Envelope pop out and drop animation */
        @keyframes popAndDrop {
            0% {
                transform: translate(0, 0) scale(0.2) rotate(0deg);
                opacity: 0;
            }
            30% {
                transform: translate(-30px, -70px) scale(1.15) rotate(-12deg);
                opacity: 1;
            }
            60% {
                transform: translate(-50px, -10px) scale(1) rotate(4deg);
                opacity: 1;
            }
            100% {
                transform: translate(-50px, 35px) scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* Cute floating animation for envelope on ground */
        @keyframes cuteFloat {
            0%, 100% {
                transform: translate(-50px, 35px) translateY(0) rotate(0deg);
            }
            50% {
                transform: translate(-50px, 35px) translateY(-8px) rotate(2deg);
            }
        }

        /* Letter unfold animation */
        @keyframes unfoldLetter {
            0% {
                transform: scale(0.7) translateY(20px);
                opacity: 0;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .car-container {
            animation: driveRightToLeft 8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-play-state: paused; /* Controlled via JS */
        }

        .envelope-drop {
            animation: popAndDrop 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, cuteFloat 3s ease-in-out 1.2s infinite;
        }

        .letter-modal {
            animation: unfoldLetter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Background moving road animation */
        @keyframes moveRoad {
            0% { background-position: 0 0; }
            100% { background-position: -100px 0; }
        }

        .road-stripes {
            background-image: linear-gradient(90deg, #ffffff 60%, transparent 40%);
            background-size: 50px 6px;
            animation: moveRoad 1s linear infinite;
            animation-play-state: paused;
        }
        
        .road-moving .road-stripes {
            animation-play-state: running;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-300 via-indigo-200 to-amber-100 h-screen w-screen flex flex-col justify-between relative">

    <!-- Clouds -->
    <div class="absolute top-10 left-10 bg-white/70 backdrop-blur-md rounded-full px-8 py-3 shadow-sm animate-pulse flex items-center space-x-2">
        <i class="fa-solid fa-cloud text-sky-400 text-xl"></i>
        <span class="text-xs font-semibold text-sky-800 tracking-wider">O zi minunată!</span>
    </div>

    <div class="absolute top-16 right-20 bg-white/60 backdrop-blur-md rounded-full px-6 py-2 shadow-sm hidden sm:flex items-center space-x-2">
        <i class="fa-solid fa-sun text-amber-500 text-xl"></i>
        <span class="text-xs font-semibold text-amber-900">Surpriză pe drum</span>
    </div>

    <!-- Main Scene Container -->
    <div class="relative w-full h-full flex items-center justify-center overflow-hidden">

        <!-- Instructions Banner / Start Button Screen -->
        <div id="start-screen" class="absolute z-30 flex flex-col items-center justify-center bg-black/30 backdrop-blur-sm inset-0 transition-opacity duration-500">
            <div class="bg-white/95 p-8 rounded-3xl shadow-2xl text-center max-w-md mx-4 border border-white">
                <div class="w-16 h-16 bg-pink-100 text-pink-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                    <i class="fa-solid fa-car-side"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800 mb-2 font-serif-custom">Curierul Special a Sosit</h1>
                <p class="text-gray-600 text-sm mb-6 leading-relaxed">Apasă pe butonul de mai jos pentru a porni mașina și a descoperi surpriza!</p>
                <button id="start-btn" class="w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-pink-500/30 transform active:scale-95 transition-all duration-200 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-play"></i>
                    <span>Pornește Mașina</span>
                </button>
            </div>
        </div>

        <!-- Road & Scenery Layer -->
        <div id="scene" class="absolute bottom-0 w-full h-48 bg-slate-800 border-t-8 border-emerald-500 shadow-2xl flex flex-col justify-start">
            <!-- Road dashed line -->
            <div class="road-stripes w-full h-2 mt-12 opacity-80"></div>
            
            <!-- Sidewalk / Grass details -->
            <div class="absolute -top-6 left-0 w-full flex justify-around opacity-40 pointer-events-none">
                <i class="fa-solid fa-tree text-emerald-700 text-2xl"></i>
                <i class="fa-solid fa-tree text-emerald-800 text-3xl"></i>
                <i class="fa-solid fa-house text-slate-600 text-2xl"></i>
                <i class="fa-solid fa-tree text-emerald-700 text-2xl"></i>
            </div>
        </div>

        <!-- Car Element using car.gif (Initially positioned off-screen right) -->
        <div id="car-wrapper" class="car-container absolute bottom-20 z-20 flex items-center cursor-pointer">
            <img src="car.gif" alt="Mașină" class="w-44 h-auto object-contain filter drop-shadow-xl transform -scale-x-100" onerror="this.onerror=null; this.src='https://placehold.co/180x90/ef4444/ffffff?text=Car+GIF';">
        </div>

        <!-- The Dropped Super Cute Letter / Envelope Container -->
        <div id="dropped-envelope" class="absolute bottom-28 z-20 opacity-0 cursor-pointer group">
            <div class="bg-gradient-to-br from-pink-100 via-rose-50 to-amber-50 border-2 border-pink-300 w-24 h-16 rounded-xl shadow-[0_10px_25px_rgba(244,63,94,0.3)] flex flex-col items-center justify-center relative overflow-hidden transition-transform transform group-hover:scale-110">
                <!-- Envelope top flap simulation -->
                <div class="absolute top-0 w-full h-8 bg-gradient-to-b from-pink-200 to-rose-100 border-b border-pink-300" style="clip-path: polygon(0 0, 50% 100%, 100% 0);"></div>
                <div class="w-6 h-6 bg-pink-500 text-white rounded-full flex items-center justify-center shadow-md mt-3 z-10 animate-bounce text-xs">
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>
            <div class="absolute -top-8 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-sm text-xs font-bold text-pink-600 px-3 py-1 rounded-full shadow-md whitespace-nowrap animate-pulse border border-pink-200">
                Atinge-mă! ✨
            </div>
        </div>

        <!-- Letter Modal / Open Letter View (Cute, empty decorative area as requested) -->
        <div id="letter-modal" class="absolute inset-0 z-40 bg-black/50 backdrop-blur-md flex items-center justify-center p-4 hidden">
            <div class="letter-modal bg-gradient-to-b from-pink-50 via-amber-50 to-white w-full max-w-md p-8 rounded-3xl shadow-2xl border-4 border-pink-200 relative text-center">
                <!-- Close Button -->
                <button id="close-modal-btn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 bg-gray-100 hover:bg-gray-200 w-8 h-8 rounded-full flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>

                <!-- Stamp / Icon Header -->
                <div class="w-16 h-16 bg-pink-100 text-pink-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner border border-pink-200 animate-bounce">
                    <i class="fa-solid fa-heart"></i>
                </div>

                <h3 class="text-xl font-bold text-gray-800 mb-1 font-serif-custom">Surpriză Magică</h3>
                <div class="w-12 h-1 bg-pink-300 rounded-full mx-auto mb-6"></div>

                <!-- Beautiful Decorative Empty Letter Area -->
                <div class="bg-white/90 p-8 rounded-2xl border-2 border-dashed border-pink-200 shadow-inner mb-6 flex flex-col items-center justify-center min-h-[140px] space-y-3">
                    <i class="fa-solid fa-feather-pointed text-pink-300 text-3xl animate-pulse"></i>
                    <p class="text-xs text-gray-400 italic">Spațiu decorativ pregătit pentru mesajul tău special...</p>
                </div>

                <!-- Footer Action Buttons -->
                <div class="flex space-x-3">
                    <button id="replay-btn" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 px-4 rounded-xl transition-colors text-sm flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-rotate-right"></i>
                        <span>Reia Animația</span>
                    </button>
                    <button id="love-btn" class="flex-1 bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-pink-500/30 transition-all text-sm flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-heart"></i>
                        <span>Minunat!</span>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const carWrapper = document.getElementById('car-wrapper');
        const scene = document.getElementById('scene');
        const droppedEnvelope = document.getElementById('dropped-envelope');
        const letterModal = document.getElementById('letter-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const replayBtn = document.getElementById('replay-btn');
        const loveBtn = document.getElementById('love-btn');

        // Function to start the car drive animation sequence
        function startAnimation() {
            startScreen.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                startScreen.style.display = 'none';
            }, 500);

            // Reset states if replaying
            carWrapper.style.animation = 'none';
            carWrapper.offsetHeight; // trigger reflow
            carWrapper.style.animation = '';
            
            carWrapper.classList.add('car-moving');
            scene.classList.add('road-moving');
            droppedEnvelope.classList.remove('envelope-drop');
            droppedEnvelope.style.opacity = '0';

            // At around 3.5 seconds (when car is near the middle), drop the envelope
            setTimeout(() => {
                droppedEnvelope.classList.add('envelope-drop');
            }, 3500);
        }

        startBtn.addEventListener('click', startAnimation);

        // Click on dropped envelope to open the letter modal
        droppedEnvelope.addEventListener('click', () => {
            letterModal.classList.remove('hidden');
        });

        // Close modal
        closeModalBtn.addEventListener('click', () => {
            letterModal.classList.add('hidden');
        });

        // Replay animation button inside modal
        replayBtn.addEventListener('click', () => {
            letterModal.classList.add('hidden');
            startAnimation();
        });

        // Love button inside modal
        loveBtn.addEventListener('click', () => {
            alertBoxCustom("O zi minunată să ai! 💖");
            letterModal.classList.add('hidden');
        });

        // Custom non-blocking message box fallback instead of window.alert()
        function alertBoxCustom(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-2xl shadow-2xl z-50 text-sm font-semibold flex items-center space-x-2 animate-bounce';
            toast.innerHTML = `<i class="fa-solid fa-face-smile text-pink-400"></i><span>${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.transition = 'opacity 0.5s ease';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }
    </script>
</body>
</html>
